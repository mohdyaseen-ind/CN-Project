worker_processes 1;
pid var/run/nginx-standby.pid;
error_log var/log/nginx-standby-error.log notice;

events {
    worker_connections 512;
}

http {
    log_format standby '$remote_addr:$remote_port -> $upstream_addr '
                       '[$status] "$request" $ssl_protocol';
    access_log var/log/nginx-standby-access.log standby;

    upstream team_backends {
        # Round-robin is nginx's default; these limits provide passive failure
        # detection and allow eligible requests to retry the other backend.
        server 127.0.0.1:3001 max_fails=1 fail_timeout=10s;
        server 10.7.18.197:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name app.team1.test api.team1.test;
        add_header X-Edge standby always;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate ../../edge/certs/app.crt;
        ssl_certificate_key ../../edge/certs/app.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://team_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 1s;
            proxy_read_timeout 5s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
            add_header X-Edge standby always;
        }
    }
}
