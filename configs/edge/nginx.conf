# Sankalp's project-local main edge. Start with scripts/edge-nginx.sh so the
# prefix, PID file, and logs stay under this checkout rather than Homebrew.
worker_processes 1;
pid var/run/nginx-edge.pid;
error_log var/log/nginx-edge-error.log notice;

events {
    # Homebrew nginx starts with a 256 descriptor limit in the current login.
    worker_connections 128;
}

http {
    server_tokens off;
    log_format edge '$remote_addr:$remote_port -> $upstream_addr '
                    '[$status] "$request" $ssl_protocol '
                    'upstream_status=$upstream_status request_time=$request_time '
                    'upstream_time=$upstream_response_time';
    access_log var/log/nginx-edge-access.log edge;

    upstream team_backends {
        # Default balancing method is round-robin. Failures are passive.
        server 10.7.28.39:3001 max_fails=1 fail_timeout=10s;
        server 10.7.18.197:3002 max_fails=1 fail_timeout=10s;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name app.team1.test api.team1.test;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate edge/certs/app.crt;
        ssl_certificate_key edge/certs/app.key;
        ssl_certificate ../../edge/certs/app.crt;
        ssl_certificate_key ../../edge/certs/app.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:10m;
        ssl_session_timeout 10m;

        add_header X-Edge primary always;

        location / {
            proxy_pass http://team_backends;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
            proxy_send_timeout 10s;
            proxy_read_timeout 10s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
