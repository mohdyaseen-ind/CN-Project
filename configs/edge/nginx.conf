# Sankalp's main edge template. Install/test on the main-edge Mac only.
worker_processes 1;
events {
    worker_connections 1024;
}

http {
    log_format lb '$remote_addr:$remote_port -> $upstream_addr '
                  '[$status] "$request" $ssl_protocol';
    access_log /opt/homebrew/var/log/nginx/access.log lb;

    upstream team_backends {
        server 10.7.28.39:3001 max_fails=1 fail_timeout=10s;
        server 10.7.18.197:3002 max_fails=1 fail_timeout=10s;
    }

    server {
        listen 8080;
        server_name app.team1.test api.team1.test;
        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 8443 ssl;
        http2 on;
        server_name app.team1.test api.team1.test;

        ssl_certificate /opt/homebrew/etc/nginx/certs/app.team1.test.crt;
        ssl_certificate_key /opt/homebrew/etc/nginx/certs/app.team1.test.key;
        ssl_protocols TLSv1.2 TLSv1.3;

        location / {
            proxy_pass http://team_backends;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_connect_timeout 2s;
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
