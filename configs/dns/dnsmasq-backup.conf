# Sankalp's backup DNS. Paths are absolute so the resolver reads the intended
# project hosts file regardless of its launch directory or privilege drop.
listen-address=127.0.0.1,10.7.26.113
bind-interfaces
port=53

domain-needed
bogus-priv
local=/team1.test/
no-resolv
server=8.8.8.8
server=1.1.1.1

addn-hosts=/Users/sankalpmtellur/Desktop/CN-Project/configs/dns/team.hosts
local-ttl=30

log-queries
log-facility=/Users/sankalpmtellur/Desktop/CN-Project/var/log/dnsmasq-backup.log
pid-file=/Users/sankalpmtellur/Desktop/CN-Project/var/run/dnsmasq-backup.pid
