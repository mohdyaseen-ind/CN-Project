# Sankalp's backup DNS. The script launches this from the project root so
# addn-hosts/log/pid paths are project-local. TCP and UDP are enabled by default.
listen-address=127.0.0.1,10.7.26.113
bind-interfaces
port=53

domain-needed
bogus-priv
local=/team1.test/
no-resolv
server=8.8.8.8
server=1.1.1.1

addn-hosts=configs/dns/team.hosts
local-ttl=30

log-queries
log-facility=var/log/dnsmasq-backup.log
pid-file=var/run/dnsmasq-backup.pid
