# Sarthak's backup DNS template. Adjust Homebrew paths for Intel Macs.
listen-address=127.0.0.1,10.7.18.197
bind-interfaces
port=53

domain-needed
bogus-priv
local=/team1.test/
no-resolv
server=8.8.8.8
server=1.1.1.1

addn-hosts=/opt/homebrew/etc/team.hosts
local-ttl=30

log-queries
log-facility=/opt/homebrew/var/log/dnsmasq-backup.log
