# Prateek's primary DNS template. This matches the verified local dnsmasq
# settings; preserve/back up the installed system config before any deployment.
# On Apple Silicon the Homebrew prefix is /opt/homebrew; Intel Macs use
# /usr/local and must adjust the addn-hosts/log-facility paths.

listen-address=127.0.0.1,10.7.28.39
bind-interfaces
port=53

domain-needed
bogus-priv
local=/team1.test/
no-resolv
server=8.8.8.8
server=1.1.1.1

addn-hosts=/opt/homebrew/etc/team.hosts
local-ttl=30

log-queries
log-facility=/opt/homebrew/var/log/dnsmasq.log
